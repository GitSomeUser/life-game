<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Life$pan</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
    <div class="dash">
      <aside class="leaderboard" aria-label="Leaderboard">
        <p class="eyebrow">Leaderboard</p>
        <p class="player" id="player-name">One player</p>
        <div class="lb-body">
          <svg id="figure" viewBox="0 0 160 130" aria-hidden="true"></svg>
          <dl class="stats">
            <div>
              <dt>Age</dt>
              <dd id="age">—</dd>
            </div>
            <div>
              <dt>Income</dt>
              <dd id="pay">—</dd>
            </div>
            <div>
              <dt>Expenses</dt>
              <dd id="expenses">—</dd>
            </div>
            <div>
              <dt>Savings</dt>
              <dd id="savings">—</dd>
            </div>
            <div>
              <dt>Years left</dt>
              <dd id="years">—</dd>
            </div>
            <div class="death-stat">
              <dt>Death</dt>
              <dd id="death-chance">—</dd>
            </div>
          </dl>
        </div>
        <p class="lever-readout" id="lever-readout">Stats are public.</p>
        <div class="triangle-wrap">
          <svg id="triangle" viewBox="0 0 260 230" role="application" aria-label="Health, work, and frugality"></svg>
          <div class="corners">
            <button type="button" data-corner="health">Health</button>
            <button type="button" data-corner="work">Work</button>
            <button type="button" data-corner="frugal">Frugality</button>
            <button type="button" data-corner="center">Center</button>
          </div>
        </div>
      </aside>

      <div class="brand">
        <p class="eyebrow">Stage 2 · v0.5.0</p>
        <h1>Life$pan</h1>
        <p class="dek">A working life, ages 18–68.</p>
        <div class="switches" role="group" aria-label="Play switches">
          <label class="switch"><input id="anim" type="checkbox" checked /> Animation</label>
          <label class="switch"><input id="speed" type="checkbox" /> Speed run</label>
        </div>
      </div>

      <aside class="minimap-wrap" aria-label="Minimap">
        <p class="eyebrow">Minimap</p>
        <div id="minimap"></div>
      </aside>
    </div>

    <section class="story" aria-live="polite">
      <div id="setup">
        <p class="setup-lead">Drag the point. Health, work, and frugality. It locks when the path starts.</p>
        <p id="share-sum"></p>
        <div class="name-row">
          <label for="game-name">Game name</label>
          <input id="game-name" autocomplete="off" />
          <button id="save" type="button">Save</button>
          <button id="resume" type="button">Resume</button>
          <button id="new-game" type="button">New game</button>
        </div>
        <p id="save-note"></p>
      </div>
      <p class="kicker" id="kicker"></p>
      <h2 id="event-title"></h2>
      <p id="event-detail"></p>
      <figure id="flavor-card" hidden>
        <img id="flavor-still" alt="" width="240" height="180" />
        <figcaption id="flavor-caption"></figcaption>
      </figure>
      <div id="choices"></div>
    </section>

    <div class="scroll">
    <div class="board-scroll">
      <div id="board"></div>
    </div>

    <details class="log-wrap" open>
      <summary>Decision log</summary>
      <ol id="log"></ol>
    </details>
    <p class="fine" id="fine"></p>
    </div>

    <div class="dock">
      <div class="wheel-wrap">
        <svg id="wheel" viewBox="0 0 200 200" aria-hidden="true"></svg>
        <button id="act" type="button">Spin</button>
      </div>
      <div class="seed-row">
        <label for="seed">Seed</label>
        <input id="seed" inputmode="numeric" autocomplete="off" />
        <button id="copy" type="button">Copy log</button>
        <p id="roll-readout"></p>
        <p id="wedge-note"></p>
      </div>
    </div>
    </div>
    <div id="death" hidden>
      <div id="death-stage"></div>
      <p id="death-caption"></p>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
