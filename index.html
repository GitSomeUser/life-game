<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Life</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="mode-unset">
    <div class="shell">
    <div class="mode-bar">
      <div class="modes" role="group" aria-label="Mode">
        <button type="button" data-mode="life"><span>Life</span></button>
        <button type="button" data-mode="lifespan"><span>Life$pan</span></button>
        <button type="button" data-mode="entirety"><span>Entirety</span></button>
      </div>
      <p id="mode-note"></p>
    </div>
    <div class="brand">
      <p class="eyebrow">v0.7.0</p>
      <h1 id="title">Life</h1>
      <p class="dek" id="dek">Pick Life, Life$pan, or Entirety.</p>
      <p id="retirement" class="retirement" hidden>Retirement is not built yet.</p>
      <div class="open-name">
        <label for="game-name">Game name</label>
        <input id="game-name" autocomplete="off" />
      </div>
      <div class="switches" role="group" aria-label="Play switches">
        <label class="switch"><input id="anim" type="checkbox" checked /> Animation</label>
        <label class="switch"><input id="speed" type="checkbox" /> Speed run</label>
      </div>
    </div>
    <div class="dash">
      <aside class="leaderboard" aria-label="Leaderboard">
        <p class="eyebrow">Leaderboard</p>
        <div class="lb-cycle">
          <button type="button" id="player-prev" aria-label="Previous player">Prev</button>
          <p class="player" id="player-name">One player</p>
          <button type="button" id="player-next" aria-label="Next player">Next</button>
        </div>
        <p class="lb-count" id="player-count">1 of 1</p>
        <div class="lb-body">
          <svg id="figure" viewBox="0 0 160 130" aria-hidden="true"></svg>
          <dl class="stats">
            <div>
              <dt>Age</dt>
              <dd id="age">—</dd>
            </div>
            <div>
              <dt id="pay-label">Pay</dt>
              <dd id="pay">—</dd>
            </div>
            <div class="stat-stage2">
              <dt>Expenses</dt>
              <dd id="expenses">—</dd>
            </div>
            <div>
              <dt id="cash-label">Cash</dt>
              <dd id="savings">—</dd>
            </div>
            <div class="stat-stage2">
              <dt>Years left</dt>
              <dd id="years">—</dd>
            </div>
            <div class="death-stat stat-stage2">
              <dt>Death</dt>
              <dd id="death-chance">—</dd>
            </div>
          </dl>
        </div>
        <p class="lever-readout" id="lever-readout">Stats are public.</p>
        <div class="triangle-wrap">
          <svg id="triangle" viewBox="0 0 260 230" role="application" aria-label="Health, work, and frugality"></svg>
          <div class="corners">
            <button type="button" data-corner="health">Health</button>
            <button type="button" data-corner="work">Work</button>
            <button type="button" data-corner="frugal">Frugality</button>
            <button type="button" data-corner="center">Center</button>
          </div>
        </div>
      </aside>

      <aside class="minimap-wrap" aria-label="Minimap">
        <p class="eyebrow">Minimap</p>
        <div id="minimap"></div>
      </aside>
    </div>

    <section class="story" aria-live="polite">
      <div id="setup">
        <p class="setup-lead" id="setup-lead">Pick a mode. It locks when Study or Work begins.</p>
        <p id="share-sum"></p>
        <div class="name-row">
          <button id="save" type="button">Save</button>
          <button id="resume" type="button">Resume</button>
          <button id="new-game" type="button">New game</button>
        </div>
        <p id="save-note"></p>
      </div>
      <p class="kicker" id="kicker"></p>
      <h2 id="event-title"></h2>
      <p id="event-detail"></p>
      <figure id="flavor-card" hidden>
        <img id="flavor-still" alt="" width="240" height="180" />
        <figcaption id="flavor-caption"></figcaption>
      </figure>
      <div id="choices"></div>
      <details class="log-wrap">
        <summary>Decision log</summary>
        <ol id="log"></ol>
      </details>
      <p class="fine" id="fine"></p>
    </section>

    <div class="scroll">
    <div class="board-scroll">
      <div id="board"></div>
    </div>
    </div>

    <div class="dock">
      <div class="wheel-wrap">
        <svg id="wheel" viewBox="0 0 200 200" aria-hidden="true"></svg>
        <button id="act" type="button">Spin</button>
      </div>
      <div class="seed-row">
        <label for="seed">Seed</label>
        <input id="seed" inputmode="numeric" autocomplete="off" />
        <button id="copy" type="button">Copy log</button>
        <p id="roll-readout"></p>
        <p id="wedge-note"></p>
      </div>
    </div>
    </div>
    <div id="death" hidden>
      <div id="death-stage"></div>
      <p id="death-caption"></p>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
